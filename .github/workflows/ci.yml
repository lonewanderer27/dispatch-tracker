name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Unit and component tests (offline)
        run: pnpm test

      - name: Deno tests for the edge function (offline)
        run: pnpm test:fn

      - name: Start local Supabase
        run: supabase start

      - name: Reset DB and check generated types for drift
        run: |
          supabase db reset
          supabase gen types typescript --local > src/types/database.types.ts
          git diff --exit-code -- src/types/database.types.ts

      - name: pgTAP database tests
        run: pnpm test:db

      - name: Write env for the app
        run: |
          supabase status -o env | grep -E '^(API_URL|ANON_KEY)=' | sed -E 's/^API_URL=/VITE_SUPABASE_URL=/; s/^ANON_KEY=/VITE_SUPABASE_ANON_KEY=/' > .env.local

      - name: Start exchange stub and edge functions
        run: |
          # The edge function runs in a container, so 127.0.0.1 is not the runner. Run the stub as a
          # container on the Supabase network and reach it by name.
          docker run -d --name exchange-stub --network supabase_network_dispatch-tracker \
            -e EXCHANGE_STUB_HOST=0.0.0.0 -v "$PWD/e2e:/app/e2e:ro" -w /app \
            node:24-alpine node --experimental-strip-types e2e/stub-exchange-server.ts
          printf 'EXCHANGE_API_URL=http://exchange-stub:4010\n' > supabase/functions/.env
          supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          sleep 10

      - run: pnpm exec playwright install --with-deps chromium

      - name: Playwright e2e
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
